<?xml version="1.0" encoding="UTF-8"?>
<svg class="main" id="logo-4" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t4">
        <title id="t4">Mocozi — flowing m</title>
        <defs>
          <!-- 메인 배경: teal에서 amber 살짝 비치는 그라데이션 -->
          <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1ab69e"/>
            <stop offset="55%" stop-color="#0f766e"/>
            <stop offset="100%" stop-color="#0a4a44"/>
          </linearGradient>
          <!-- 상단 하이라이트 -->
          <linearGradient id="hi4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
            <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <!-- M 글리프 그라데이션 -->
          <linearGradient id="m4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fef9e8"/>
            <stop offset="100%" stop-color="#f4f1e8"/>
          </linearGradient>
          <!-- amber accent dot -->
          <radialGradient id="dot4" cx="0.3" cy="0.3" r="0.8">
            <stop offset="0%" stop-color="#fcd34d"/>
            <stop offset="100%" stop-color="#d97706"/>
          </radialGradient>
          <!-- 하단 부드러운 어둠 -->
          <radialGradient id="shadow4" cx="0.5" cy="1" r="0.8">
            <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- 배경 -->
        <rect width="200" height="200" rx="44.74" fill="url(#bg4)"/>
        <!-- 하단 그림자 -->
        <rect width="200" height="200" rx="44.74" fill="url(#shadow4)"/>
        <!-- 상단 광택 -->
        <rect width="200" height="200" rx="44.74" fill="url(#hi4)"/>
        
        <!-- M 글리프 - 두 봉우리가 부드럽게 만나는 형태 -->
        <!-- 좌측 봉우리 채워진 영역 -->
        <path d="&#10;          M 50 144&#10;          L 50 80&#10;          Q 50 64, 66 64&#10;          Q 78 64, 82 78&#10;          L 100 122&#10;          L 100 144&#10;          Z&#10;        " fill="url(#m4)"/>
        <!-- 우측 봉우리 -->
        <path d="&#10;          M 100 144&#10;          L 100 122&#10;          L 118 78&#10;          Q 122 64, 134 64&#10;          Q 150 64, 150 80&#10;          L 150 144&#10;          Z&#10;        " fill="url(#m4)" opacity="0.92"/>
        <!-- 중앙 V 강조 -->
        <path d="&#10;          M 82 78&#10;          L 100 122&#10;          L 118 78&#10;        " fill="none" stroke="#0a4a44" stroke-width="1" opacity="0.12" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- amber accent: 우측 상단 점 (액션 신호) -->
        <circle cx="150" cy="64" r="10" fill="url(#dot4)"/>
        <!-- 점 위 광택 -->
        <ellipse cx="146" cy="60" rx="3" ry="2" fill="#ffffff" opacity="0.55"/>
      </svg>