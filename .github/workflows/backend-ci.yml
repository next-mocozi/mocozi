name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'shared/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mocozi
          POSTGRES_PASSWORD: mocozi_password
          POSTGRES_DB: mocozi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Node.js ${{ matrix.node-version }} 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: 린트 검사
        run: pnpm lint
        working-directory: backend

      - name: 빌드
        run: pnpm build
        working-directory: backend

      - name: 테스트
        run: pnpm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://mocozi:mocozi_password@localhost:5432/mocozi_test_db
          JWT_SECRET: test-jwt-secret
